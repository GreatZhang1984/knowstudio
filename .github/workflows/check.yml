name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Full check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MYSQL_ROOT_PASSWORD: knowstudio-ci-root
      MYSQL_DATABASE: knowstudio
      MYSQL_USER: knowstudio
      MYSQL_PASSWORD: knowstudio-ci-db
      # GitHub runner 经宿主端口映射进入 Docker 网络时，mysql2 对业务账号的
      # caching_sha2 认证会稳定失败；CI 是一次性环境，迁移和测试直接用 root。
      DATABASE_URL: mysql://root:knowstudio-ci-root@127.0.0.1:3306/knowstudio
      KNOWSTUDIO_DB_USER: root
      KNOWSTUDIO_DB_PASSWORD: knowstudio-ci-root
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: knowstudio-ci-jwt-secret-not-for-prod
      LOCAL_STORAGE_ROOT: ${{ github.workspace }}/.local-storage-ci
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          ffmpeg -version | head -n 1
          docker compose version

      - name: Start infrastructure
        # 当前检查链路使用 LOCAL_STORAGE_ROOT；MinIO S3 冒烟测试后续单独补，
        # 先避免 CI 依赖可用性不稳定的 minio/minio:latest 镜像。
        run: docker compose --project-directory infra up -d mysql redis

      - name: Wait for infrastructure
        run: |
          for i in $(seq 1 90); do
            mysql_status=$(docker inspect --format='{{.State.Health.Status}}' knowstudio-mysql84 2>/dev/null || echo missing)
            redis_status=$(docker exec knowstudio-redis7 redis-cli ping 2>/dev/null || echo missing)
            echo "mysql=$mysql_status redis=$redis_status"
            if [ "$mysql_status" = healthy ] && [ "$redis_status" = PONG ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-directory infra ps
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check database capabilities
        run: pnpm exec tsx packages/db/migrations/cli.ts capabilities

      - name: Run migrations
        run: pnpm exec tsx packages/db/migrations/cli.ts migrate

      - name: Seed database
        run: pnpm exec tsx packages/db/migrations/cli.ts seed

      - name: Run full check
        run: pnpm check
