name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Full check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MYSQL_ROOT_PASSWORD: knowstudio-ci-root
      MYSQL_DATABASE: knowstudio
      MYSQL_USER: knowstudio
      MYSQL_PASSWORD: knowstudio-ci-db
      MINIO_ROOT_USER: knowstudio-ci-minio
      MINIO_ROOT_PASSWORD: knowstudio-ci-minio-secret
      DATABASE_URL: mysql://knowstudio:knowstudio-ci-db@127.0.0.1:3306/knowstudio
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: knowstudio-ci
      S3_ACCESS_KEY_ID: knowstudio-ci-minio
      S3_SECRET_ACCESS_KEY: knowstudio-ci-minio-secret
      S3_FORCE_PATH_STYLE: 'true'
      JWT_SECRET: knowstudio-ci-jwt-secret-not-for-prod
      LOCAL_STORAGE_ROOT: ${{ github.workspace }}/.local-storage-ci
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          ffmpeg -version | head -n 1
          docker compose version

      - name: Start infrastructure
        # 当前检查链路使用 LOCAL_STORAGE_ROOT；MinIO S3 冒烟测试后续单独补，
        # 先避免 CI 依赖可用性不稳定的 minio/minio:latest 镜像。
        run: docker compose --project-directory infra up -d mysql redis

      - name: Wait for infrastructure
        run: |
          for i in $(seq 1 90); do
            mysql_status=$(docker inspect --format='{{.State.Health.Status}}' knowstudio-mysql84 2>/dev/null || echo missing)
            redis_status=$(docker exec knowstudio-redis7 redis-cli ping 2>/dev/null || echo missing)
            echo "mysql=$mysql_status redis=$redis_status"
            if [ "$mysql_status" = healthy ] && [ "$redis_status" = PONG ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-directory infra ps
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI database user
        run: >
          docker exec knowstudio-mysql84 mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e
          "CREATE USER IF NOT EXISTS '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';
          ALTER USER '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';
          GRANT ALL PRIVILEGES ON $MYSQL_DATABASE.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"

      - name: Verify CI database login
        run: |
          printf 'env-password-sha256='
          printf '%s' "$MYSQL_PASSWORD" | sha256sum | cut -d' ' -f1
          node -e "const {createHash}=require('node:crypto'); const u=new URL(process.env.DATABASE_URL); console.log('url-password-sha256='+createHash('sha256').update(u.password).digest('hex'))"
          docker exec knowstudio-mysql84 mysql -h127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" -e 'SELECT 1'

      - name: Check database capabilities
        run: pnpm exec tsx packages/db/migrations/cli.ts capabilities

      - name: Run migrations
        run: pnpm exec tsx packages/db/migrations/cli.ts migrate

      - name: Seed database
        run: pnpm exec tsx packages/db/migrations/cli.ts seed

      - name: Run full check
        run: pnpm check
